<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ITE Shop</title>
  <!-- Bootstrap 5 CSS CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f8f9fa;
    }
    .cart-item-btn {
      padding: 0px 7px;
      line-height: 1.2;
    }
  </style>
</head>
<body>

  <nav class="navbar navbar-dark bg-dark px-4 py-3">
    <div class="container-fluid">
      <span class="navbar-brand mb-0 h1 fw-bold">ITE Shop</span>
      <div class="text-white fs-6">
        Cart <span id="cart-badge" class="badge bg-warning text-dark ms-1">0</span>
      </div>
    </div>
  </nav>

  <div class="container my-4">
    <div class="row g-4">
 
      <div class="col-lg-8">
        <div class="row g-3" id="product-container">
        
        </div>
      </div>

      
      <div class="col-lg-4">
        <div class="card shadow-sm">
          <div class="card-header bg-primary text-white fw-bold py-3">
            Your Cart
          </div>
          <div class="card-body p-0">
            <ul class="list-group list-group-flush" id="cart-list">
              <li class="list-group-item text-muted py-3">Cart is empty</li>
            </ul>
          </div>
          <div class="card-footer bg-white border-top fw-bold py-3">
            Total: $<span id="cart-total">0.00</span>
          </div>
        </div>
      </div>

    </div>
  </div>

  <script>

    const products = [
      { id: 1, name: 'Keyboard', price: 25.50 },
      { id: 2, name: 'Mouse', price: 12.00 },
      { id: 3, name: 'Monitor', price: 149.99 },
      { id: 4, name: 'USB Hub', price: 18.75 }
    ];

    let cart = [];

    function renderProducts() {
      const container = document.getElementById('product-container');
      container.innerHTML = products.map(product => `
        <div class="col-md-6">
          <div class="card h-100 shadow-sm">
            <div class="card-body d-flex flex-column justify-content-between py-4">
              <div>
                <h5 class="card-title fw-bold mb-2">${product.name}</h5>
                <p class="card-text text-dark mb-3">$${product.price.toFixed(2)}</p>
              </div>
              <div>
                <button class="btn btn-primary btn-sm fw-medium px-3" onclick="addToCart(${product.id})">
                  Add to cart
                </button>
              </div>
            </div>
          </div>
        </div>
      `).join('');
    }

    function addToCart(productId) {
      const existingItem = cart.find(item => item.id === productId);
      if (existingItem) {
        existingItem.quantity += 1;
      } else {
        const product = products.find(p => p.id === productId);
        cart.push({ ...product, quantity: 1 });
      }
      updateCartUI();
    }

    function removeFromCart(productId) {
      const itemIndex = cart.findIndex(item => item.id === productId);
      if (itemIndex > -1) {
        if (cart[itemIndex].quantity > 1) {
          cart[itemIndex].quantity -= 1;
        } else {
          cart.splice(itemIndex, 1);
        }
      }
      updateCartUI();
    }

    function updateCartUI() {
      const cartList = document.getElementById('cart-list');
      const cartBadge = document.getElementById('cart-badge');
      const cartTotal = document.getElementById('cart-total');

      if (cart.length === 0) {
        cartList.innerHTML = '<li class="list-group-item text-black py-3">Cart is empty</li>';
        cartBadge.innerText = '0';
        cartTotal.innerText = '0.00';
        return;
      }

      let totalCount = 0;
      let totalPrice = 0;

      cartList.innerHTML = cart.map(item => {
        const lineTotal = item.price * item.quantity;
        totalCount += item.quantity;
        totalPrice += lineTotal;

        return `
          <li class="list-group-item d-flex justify-content-between align-items-center py-3">
            <span>${item.name} x ${item.quantity}</span>
            <div class="d-flex align-items-center gap-3">
              <span>$${lineTotal.toFixed(2)}</span>
              <button class="btn btn-outline-danger btn-sm cart-item-btn" onclick="removeFromCart(${item.id})">-</button>
            </div>
          </li>
        `;
      }).join('');

      cartBadge.innerText = totalCount;
      cartTotal.innerText = totalPrice.toFixed(2);
    }

    renderProducts();
  </script>
</body>
</html>
