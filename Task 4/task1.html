<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Card - Show More</title>
    <style>
        /* Reset and Base Styles */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #ebf1f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* Card Container */
        .card {
            background-color: #ffffff;
            width: 380px;
            padding: 40px 30px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            text-align: center;
        }

        /* Profile Image Circle */
        .profile-img {
            width: 100px;
            height: 100px;
            background-color: #e2e8f0;
            border-radius: 50%;
            margin: 0 auto 24px auto;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Typography */
        .name {
            color: #1e3a8a;
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 12px;
        }

        .title {
            color: #334155;
            font-size: 15px;
            font-weight: 500;
            margin-bottom: 24px;
        }

        /* Primary Button */
        .btn {
            background-color: #1e3a8a;
            color: #ffffff;
            border: none;
            padding: 10px 28px;
            font-size: 14px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .btn:hover {
            background-color: #172554;
        }

        /* Expandable Content Area */
        .more-info {
            max-height: 0;
            overflow: hidden;
            opacity: 0;
            transition: max-height 0.3s ease-out, margin-top 0.3s ease, opacity 0.3s ease;
        }

        /* Active State triggered by JavaScript */
        .more-info.show {
            max-height: 100px; 
            margin-top: 20px;
            opacity: 1;
        }

        .more-info p {
            color: #1e293b;
            font-size: 14px;
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="profile-img">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="#cbd5e1" width="48" height="48">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 4c1.93 0 3.5 1.57 3.5 3.5S13.93 13 12 13s-3.5-1.57-3.5-3.5S10.07 6 12 6zm0 14c-2.03 0-4.43-.82-6.14-2.88C7.55 15.8 9.68 15 12 15s4.45.8 6.14 2.12C16.43 19.18 14.03 20 12 20z"/>
            </svg>
        </div>

        <h2 class="name">Sok Dara</h2>
        <p class="title">Information Technology Engineering</p>

        <button id="toggle-btn" class="btn">Show more</button>

        <div id="more-info" class="more-info">
            <p>I am a year 3 student at RUPP. I love web development and coffee.</p>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const toggleBtn = document.getElementById('toggle-btn');
            const moreInfo = document.getElementById('more-info');

            toggleBtn.addEventListener('click', () => {
                // Toggles the visibility layout state
                moreInfo.classList.toggle('show');

                // Changes button text depending on if the element is shown
                if (moreInfo.classList.contains('show')) {
                    toggleBtn.textContent = 'Show less';
                } else {
                    toggleBtn.textContent = 'Show more';
                }
            });
        });
    </script>
</body>
</html>
