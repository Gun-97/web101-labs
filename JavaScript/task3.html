<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sorting an array</title>
<style>
  body {
    font-family: Arial, Helvetica, sans-serif;
    margin: 0;
    padding: 40px;
    background-color: #ffffff;
  }
  .converter-box {
    background-color: #f5a742;
    border-radius: 8px;
    padding: 40px;
    max-width: 700px;
  }
  .converter-box h1 {
    color: #555;
    font-weight: normal;
    font-size: 32px;
    margin-top: 0;
  }
  .converter-box input {
    width: 100%;
    box-sizing: border-box;
    padding: 14px;
    font-size: 18px;
    border: none;
    border-radius: 4px;
    margin-bottom: 25px;
  }
  .converter-box button {
    display: block;
    padding: 14px 40px;
    font-size: 18px;
    border: none;
    border-radius: 4px;
    background-color: #ffffff;
    cursor: pointer;
  }
  .converter-box button:hover {
    background-color: #eee;
  }
  #output {
    margin-top: 25px;
    font-size: 18px;
    color: #333;
    font-weight: bold;
    min-height: 24px;
    word-break: break-word;
  }
</style>
</head>
<body>

<div class="converter-box">
  <h1>Sort array</h1>
  <input type="text" id="arrInput" placeholder="Enter numbers separated by commas, e.g. 3,8,7,6,5,-4,3,2,1">
  <button id="sortBtn">Sort</button>
  <div id="output"></div>
</div>

<script>
  function sortArray(arr) {
    const result = arr.slice();
    const n = result.length;
    for (let i = 0; i < n - 1; i++) {
      for (let j = 0; j < n - 1 - i; j++) {
        if (result[j] > result[j + 1]) {
          const temp = result[j];
          result[j] = result[j + 1];
          result[j + 1] = temp;
        }
      }
    }
    return result;
  }

  document.getElementById("sortBtn").addEventListener("click", () => {
    const raw = document.getElementById("arrInput").value.trim();
    const outputEl = document.getElementById("output");
    if (raw === "") {
      outputEl.textContent = "Please enter numbers separated by commas.";
      return;
    }
    const arr = raw.split(",").map(s => parseFloat(s.trim())).filter(n => !isNaN(n));
    const sorted = sortArray(arr);
    outputEl.textContent = sorted.join(",");
  });

  document.getElementById("arrInput").addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
      document.getElementById("sortBtn").click();
    }
  });

  // var arr1 = [3, 8, 7, 6, 5, -4, 3, 2, 1];
  // sortArray(arr1) => [-4, 1, 2, 3, 3, 5, 6, 7, 8]
</script>

</body>
</html>
