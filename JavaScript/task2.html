<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Palindrome number checker</title>
<style>
  body {
    font-family: Arial, Helvetica, sans-serif;
    margin: 0;
    padding: 40px;
    background-color: #ffffff;
  }
  .converter-box {
    background-color: #f5a742;
    border-radius: 8px;
    padding: 40px;
    max-width: 700px;
  }
  .converter-box h1 {
    color: #555;
    font-weight: normal;
    font-size: 32px;
    margin-top: 0;
  }
  .converter-box input {
    width: 100%;
    box-sizing: border-box;
    padding: 14px;
    font-size: 18px;
    border: none;
    border-radius: 4px;
    margin-bottom: 25px;
  }
  .converter-box button {
    display: block;
    padding: 14px 40px;
    font-size: 18px;
    border: none;
    border-radius: 4px;
    background-color: #ffffff;
    cursor: pointer;
  }
  .converter-box button:hover {
    background-color: #eee;
  }
  #output {
    margin-top: 25px;
    font-size: 18px;
    color: #333;
    font-weight: bold;
    min-height: 24px;
    word-break: break-word;
  }
</style>
</head>
<body>

<div class="converter-box">
  <h1>Palindrome number checker</h1>
  <input type="text" id="numInput" placeholder="Enter number">
  <button id="checkBtn">Check</button>
  <div id="output"></div>
</div>

<script>
  function isPalindrome(numStr) {
    const reversed = numStr.split("").reverse().join("");
    return numStr === reversed;
  }

  document.getElementById("checkBtn").addEventListener("click", () => {
    const val = document.getElementById("numInput").value.trim();
    const outputEl = document.getElementById("output");
    if (val === "") {
      outputEl.textContent = "Please enter a number.";
      return;
    }
    if (isPalindrome(val)) {
      outputEl.textContent = "Number is a palindrome number";
    } else {
      outputEl.textContent = "Number is not a palindrome number";
    }
  });

  document.getElementById("numInput").addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
      document.getElementById("checkBtn").click();
    }
  });
</script>

</body>
</html>
