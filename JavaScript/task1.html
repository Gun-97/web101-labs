<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Number to string converter</title>
<style>
  body {
    font-family: Arial, Helvetica, sans-serif;
    margin: 0;
    padding: 40px;
    background-color: #ffffff;
  }
  .converter-box {
    background-color: #f5a742;
    border-radius: 8px;
    padding: 40px;
    max-width: 700px;
  }
  .converter-box h1 {
    color: #555;
    font-weight: normal;
    font-size: 32px;
    margin-top: 0;
  }
  .converter-box input {
    width: 100%;
    box-sizing: border-box;
    padding: 14px;
    font-size: 18px;
    border: none;
    border-radius: 4px;
    margin-bottom: 25px;
  }
  .converter-box button {
    display: block;
    padding: 14px 40px;
    font-size: 18px;
    border: none;
    border-radius: 4px;
    background-color: #ffffff;
    cursor: pointer;
  }
  .converter-box button:hover {
    background-color: #eee;
  }
  #output {
    margin-top: 25px;
    font-size: 18px;
    color: #333;
    font-weight: bold;
    min-height: 24px;
    word-break: break-word;
  }
</style>
</head>
<body>

<div class="converter-box">
  <h1>Number to string converter</h1>
  <input type="text" id="numInput" placeholder="Enter number">
  <button id="convertBtn">Convert</button>
  <div id="output"></div>
</div>

<script>
  const words = ["zero", "one", "two", "three", "four", "five", "six", "seven", "eight", "nine"];

  function numberToString(numStr) {
    let result = "";
    for (const ch of numStr) {
      if (ch >= "0" && ch <= "9") {
        result += words[parseInt(ch)];
      }
    }
    return result;
  }

  document.getElementById("convertBtn").addEventListener("click", () => {
    const val = document.getElementById("numInput").value;
    document.getElementById("output").textContent = numberToString(val);
  });

  document.getElementById("numInput").addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
      document.getElementById("convertBtn").click();
    }
  });
</script>

</body>
</html>
